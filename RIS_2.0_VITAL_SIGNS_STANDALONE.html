<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LGH Nursing Service Department - VITAL SIGNS MONITORING SHEET</title>
<link rel="stylesheet" href="auth.css">
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    background: #e8e8e8;
}
body { padding: 14px; }

button {
    border: 1px solid #222;
    background: #fff;
    color: #111;
    padding: 8px 12px;
    border-radius: 4px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
}
button:hover { background: #eee; }
button.primary { background: #111; color: #fff; }
button:disabled { opacity: .45; cursor: not-allowed; }

.vs-toolbar {
    width: min(100%, 202.38mm);
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #fff;
    border: 1px solid #bbb;
    padding: 8px 10px;
    border-radius: 6px;
    flex-wrap: wrap;
}
.vs-toolbar strong { font-size: 16px; margin-right: 10px; }
.toolbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* A4 photo-matched canvas. A4 = 210 x 297mm; 0.15in margin = 3.81mm/side. */
.vs-sheet {
    width: 202.38mm;
    min-height: 289.00mm;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 2px 14px rgba(0,0,0,.12);
    padding: 4mm 4mm 6mm;
}

table {
    width: 100%;
    border-collapse: collapse;
    border-spacing: 0;
    table-layout: fixed;
    background: #fff;
}
th, td {
    border: 1px solid #111;
    padding: 0;
    vertical-align: middle;
    overflow: hidden;
}

/* ===== Header ===== */
.header-table { margin-bottom: 3mm; }
.header-table .logo-col { width: 17%; }
.header-table .meta-col { width: 18%; }
.logo-cell {
    text-align: center;
    vertical-align: middle;
    padding: 1.5mm;
}
.logo-cell img {
    width: 24mm;
    height: 24mm;
    object-fit: contain;
}
.header-center {
    text-align: center;
    vertical-align: middle;
    padding: 1.5mm 2mm;
    line-height: 1.15;
}
.header-center .republic { font-size: 9.5pt; font-weight: 700; }
.header-center .department { font-size: 9.5pt; font-weight: 800; }
.header-center .hospital { font-size: 12.5pt; font-weight: 900; margin-top: 1.4mm; }
.header-center .nursing { font-size: 11.5pt; font-weight: 900; text-decoration: underline; margin-top: 1.2mm; }
.header-center .vs-title { font-size: 16pt; font-weight: 900; margin-top: 1.6mm; }
.meta-cell {
    font-size: 8.4pt;
    line-height: 1.2;
    padding: 1.4mm 1.6mm;
    vertical-align: middle;
    text-align: center;
}
.meta-cell b { font-size: 9pt; }

/* ===== Date / Shift line ===== */
.date-shift-row {
    display: flex;
    align-items: baseline;
    gap: 8mm;
    margin: 4mm 0 4mm;
    font-size: 12pt;
    font-weight: 700;
}
.date-shift-row .field { display: flex; align-items: baseline; gap: 2mm; flex: 1; }
.date-shift-row label { white-space: nowrap; }
.date-shift-row input {
    flex: 1;
    border: 0;
    border-bottom: 1px solid #111;
    outline: 0;
    font: inherit;
    font-weight: 400;
    padding: 1px 2px;
    background: transparent;
}

/* ===== Vitals table ===== */
.vs-table thead th {
    font-size: 11pt;
    font-weight: 800;
    text-align: center;
    padding: 2mm 1mm;
    background: #fff;
}
.vs-table col.col-name { width: 25%; }
.vs-table col.col-bp,
.vs-table col.col-r { width: 9.5%; }
.vs-table col.col-t,
.vs-table col.col-p { width: 8%; }
.vs-table col.col-o2sat,
.vs-table col.col-po { width: 10.5%; }
.vs-table col.col-uo,
.vs-table col.col-bm { width: 7.5%; }

.vs-table td { height: 8.3mm; padding: 0; }
.vs-table td.name-cell { padding: 0 1.5mm; }
.vs-table td.name-cell input {
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    font: inherit;
    font-size: 10pt;
    padding: 0 1mm;
}

/* diagonal-guide cells: BP / T / P / R, matching the printed original */
.vs-table td.diag {
    position: relative;
    background-image: linear-gradient(to top right,
        transparent calc(50% - 0.4px),
        #111 50%,
        transparent calc(50% + 0.4px));
}
.vs-table td.diag textarea {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    font: inherit;
    font-size: 7.6pt;
    line-height: 1.05;
    padding: 0.5mm;
    text-align: center;
}

.vs-table td.plain textarea {
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    font: inherit;
    font-size: 9pt;
    padding: 0.5mm 1mm;
}

.row-remove {
    display: none;
}

.vs-footer-print { display: none; }

/* ===== Screen-only row controls ===== */
.row-controls-col { width: 22px; }
.row-remove-btn {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    color: #b00;
    font-weight: 900;
    cursor: pointer;
    font-size: 12px;
}
.row-remove-btn:hover { background: #fee; }

/* ===== Print ===== */
@media print {
    html, body {
        width: auto !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        overflow: visible !important;
    }
    .vs-toolbar, .status-toast, .row-controls-col { display: none !important; }
    .vs-sheet {
        width: 202.38mm !important;
        min-height: 0 !important;
        margin: 0 auto !important;
        box-shadow: none !important;
        padding: 4mm 4mm 4mm !important;
    }
    .date-shift-row input { border-bottom: 1px solid #111 !important; }
    @page { size: A4 portrait; margin: 3.81mm; }
}

.status-toast {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    background: #111;
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 200;
}
.status-toast.show { opacity: 1; }
</style>
</head>

<script>
window.RIS_BOOTSTRAP.then(() => {
const ROW_COUNT_DEFAULT = 24;
const STORAGE_KEY = "lghVitalSignsSheetV1";

function rowTemplate() {
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td class="name-cell"><input type="text" class="vs-name" placeholder=""></td>
        <td class="diag"><textarea class="vs-field" data-field="bp"></textarea></td>
        <td class="diag"><textarea class="vs-field" data-field="t"></textarea></td>
        <td class="diag"><textarea class="vs-field" data-field="p"></textarea></td>
        <td class="diag"><textarea class="vs-field" data-field="r"></textarea></td>
        <td class="plain"><textarea class="vs-field" data-field="o2sat"></textarea></td>
        <td class="plain"><textarea class="vs-field" data-field="po"></textarea></td>
        <td class="plain"><textarea class="vs-field" data-field="uo"></textarea></td>
        <td class="plain"><textarea class="vs-field" data-field="bm"></textarea></td>
        <td><button type="button" class="row-remove-btn" title="Remove row" onclick="removeRow(this)">&times;</button></td>
    `;
    return tr;
}

function addRow(focus) {
    const body = document.getElementById("vsRows");
    const tr = rowTemplate();
    body.appendChild(tr);
    attachAutosave(tr);
    if (focus) tr.querySelector(".vs-name").focus();
    saveSheet();
}

function removeRow(btn) {
    const tr = btn.closest("tr");
    const body = document.getElementById("vsRows");
    if (body.children.length <= 1) { showToast("At least one row is required."); return; }
    tr.remove();
    saveSheet();
}

function clearSheet() {
    if (!confirm("Clear the Date, Shift, and all entered rows on this sheet?")) return;
    document.getElementById("vsDate").value = "";
    document.getElementById("vsShift").value = "";
    document.querySelectorAll(".vs-name, .vs-field").forEach(el => el.value = "");
    saveSheet();
    showToast("Sheet cleared.");
}

function attachAutosave(scope) {
    scope.querySelectorAll("input, textarea").forEach(el => {
        el.addEventListener("input", saveSheet);
    });
}

function saveSheet() {
    const rows = Array.from(document.querySelectorAll("#vsRows tr")).map(tr => ({
        name: tr.querySelector(".vs-name").value,
        bp: tr.querySelector('[data-field="bp"]').value,
        t: tr.querySelector('[data-field="t"]').value,
        p: tr.querySelector('[data-field="p"]').value,
        r: tr.querySelector('[data-field="r"]').value,
        o2sat: tr.querySelector('[data-field="o2sat"]').value,
        po: tr.querySelector('[data-field="po"]').value,
        uo: tr.querySelector('[data-field="uo"]').value,
        bm: tr.querySelector('[data-field="bm"]').value
    }));
    const data = {
        date: document.getElementById("vsDate").value,
        shift: document.getElementById("vsShift").value,
        rows
    };
    try { RISStore.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
}

function loadSheet() {
    let data = null;
    try { data = JSON.parse(RISStore.getItem(STORAGE_KEY)); } catch (_) {}
    const body = document.getElementById("vsRows");
    body.innerHTML = "";

    if (data && Array.isArray(data.rows) && data.rows.length) {
        document.getElementById("vsDate").value = data.date || "";
        document.getElementById("vsShift").value = data.shift || "";
        data.rows.forEach(r => {
            const tr = rowTemplate();
            tr.querySelector(".vs-name").value = r.name || "";
            tr.querySelector('[data-field="bp"]').value = r.bp || "";
            tr.querySelector('[data-field="t"]').value = r.t || "";
            tr.querySelector('[data-field="p"]').value = r.p || "";
            tr.querySelector('[data-field="r"]').value = r.r || "";
            tr.querySelector('[data-field="o2sat"]').value = r.o2sat || r.ivf || "";
            tr.querySelector('[data-field="po"]').value = r.po || "";
            tr.querySelector('[data-field="uo"]').value = r.uo || "";
            tr.querySelector('[data-field="bm"]').value = r.bm || "";
            body.appendChild(tr);
            attachAutosave(tr);
        });
    } else {
        for (let i = 0; i < ROW_COUNT_DEFAULT; i++) {
            const tr = rowTemplate();
            body.appendChild(tr);
            attachAutosave(tr);
        }
    }
}

let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById("statusToast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

document.getElementById("vsDate").addEventListener("input", saveSheet);
document.getElementById("vsShift").addEventListener("input", saveSheet);

loadSheet();
});
</script>
