<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIS Sign In</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
        <img src="RIS_2.0_HOSPITAL_LOGO.jpg" alt="Hospital logo" class="login-logo">
        <p class="eyebrow">LAS PIÑAS GENERAL HOSPITAL</p>
        <h1 id="loginTitle">RIS Sign In</h1>
        <p class="intro">Use your authorized account to access patient records.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
            <button id="signInButton" type="submit">SIGN IN</button>
        </form>

        <button id="createAccountButton" class="secondary" type="button">CREATE ACCOUNT</button>
        <button id="forgotPasswordButton" class="text-button" type="button">Forgot password?</button>
        <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="login.js"></script>
</body>
</html>
